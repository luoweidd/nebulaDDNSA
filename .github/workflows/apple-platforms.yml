name: Apple Platform CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package macOS CI artifact
        run: |
          app="build/macos/Build/Products/Release/Nebula DDNS.app"
          test -d "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" Nebula-DDNS-macOS-ci.zip

      - name: Upload macOS CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-ci
          path: Nebula-DDNS-macOS-ci.zip
          if-no-files-found: error
          retention-days: 7

  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign

      - name: Package iOS CI artifact
        run: |
          app="build/ios/iphoneos/Runner.app"
          test -d "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" Nebula-DDNS-iOS-unsigned-ci.zip

      - name: Upload iOS CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ci
          path: Nebula-DDNS-iOS-unsigned-ci.zip
          if-no-files-found: error
          retention-days: 7
