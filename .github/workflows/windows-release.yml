name: Windows CI and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        id: package
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ($env:TAG_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag must use vX.Y.Z format: $env:TAG_NAME"
          }
          $version = $Matches.version
          $manifest = Get-Content -Path pubspec.yaml -Raw
          $manifestVersion = [regex]::Match($manifest, '(?m)^version:\s*(\d+\.\d+\.\d+)').Groups[1].Value
          if ($version -ne $manifestVersion) {
            throw "Tag version $version does not match pubspec.yaml version $manifestVersion"
          }
          $assetName = "Nebula-DDNS-$version-Windows-x64.zip"
          Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath $assetName -CompressionLevel Optimal
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT

      - name: Upload Windows release archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ${{ steps.package.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          gh release create "$TAG_NAME" "dist/Nebula-DDNS-$version-Windows-x64.zip" \
            --title "Nebula DDNS $version" \
            --generate-notes \
            --verify-tag
