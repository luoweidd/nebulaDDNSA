name: Desktop CI and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      PUB_CACHE: ${{ github.workspace }}\.pub-cache
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
          pub-cache-path: ${{ github.workspace }}\.pub-cache

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        id: package
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ($env:TAG_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag must use vX.Y.Z format: $env:TAG_NAME"
          }
          $version = $Matches.version
          $manifest = Get-Content -Path pubspec.yaml -Raw
          $manifestVersion = [regex]::Match($manifest, '(?m)^version:\s*(\d+\.\d+\.\d+)').Groups[1].Value
          if ($version -ne $manifestVersion) {
            throw "Tag version $version does not match pubspec.yaml version $manifestVersion"
          }
          $assetName = "Nebula-DDNS-$version-Windows-x64.zip"
          Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath $assetName -CompressionLevel Optimal
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT

      - name: Upload Windows release archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ${{ steps.package.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libayatana-appindicator3-dev

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package Linux release
        if: startsWith(github.ref, 'refs/tags/v')
        id: package
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tag must use vX.Y.Z format: $TAG_NAME" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          manifest_version="$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)"
          if [[ "$version" != "$manifest_version" ]]; then
            echo "Tag version $version does not match pubspec.yaml version $manifest_version" >&2
            exit 1
          fi
          bundle="build/linux/x64/release/bundle"
          test -x "$bundle/nebula_ddns"
          test -d "$bundle/data/flutter_assets"
          asset_name="Nebula-DDNS-$version-Linux-x64.tar.gz"
          tar -czf "$PWD/$asset_name" -C build/linux/x64/release bundle
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"

      - name: Upload Linux release archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: ${{ steps.package.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist/windows

      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: dist/linux

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          gh release create "$TAG_NAME" \
            "dist/windows/Nebula-DDNS-$version-Windows-x64.zip" \
            "dist/linux/Nebula-DDNS-$version-Linux-x64.tar.gz" \
            --title "Nebula DDNS $version" \
            --generate-notes \
            --verify-tag
